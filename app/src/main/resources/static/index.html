<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Select Role</title>
        <link rel="icon" type="image/png" href="./assets/images/logo/Logo.png">
        <link rel="stylesheet" href="./assets/css/index.css">
        <link rel="stylesheet" href="./assets/css/style.css">
        <script src="./js/util.js" defer></script>
        <script src="./js/render.js" defer></script>
        <script src="./js/components/header.js" defer></script>
        <script src="./js/components/footer.js" defer></script>
    </head>
    <body>
        <div class="container">
            <div class = "wrapper">
                <div id="header"></div>
                <main class = "main-content">
                    <h2>Select Your Role</h2>
                    <button id="adminLogin" onclick="selectRole('admin')">Admin</button>
                    <button id="patientLogin" onclick="selectRole('patient')">Patient</button>
                    <button id="doctorLogin" onclick="selectRole('doctor')">Doctor</button>
                </main>
                <div id="footer">
                </div>
                <div id="modal" class="modal">
                    <button id="closeModal">&times;</button>
                    <div id="modal-body"></div>
                </div>
            </div>
        <script type="module" src="./js/services/index.js" defer></script>
    </body>

</html>

    * Add a modal overlay for popups (like login forms).
    * Include a close button and an inner container for dynamic content.

    * Use a `<script type="module">` tag to load the role selection logic (e.g., `index.js`).
    * Ensure it’s deferred so it doesn’t block HTML rendering.
